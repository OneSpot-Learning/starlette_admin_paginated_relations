[project]
name = "starlette-admin-paginated-relations"
version = "0.1.1"
description = "A PaginatedHasMany field for starlette-admin: paginates a has-many relation's list/detail rendering instead of loading the full collection."
requires-python = ">=3.11"
dependencies = [
    "starlette-admin",
    "sqlalchemy>=2.0",
    "sqlakeyset>=2.0",
    "anyio",
]

[build-system]
requires = ["poetry-core>=2.2.1"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)"
]
