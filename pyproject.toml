[project]
name = "starlette-admin-paginated-relations"
version = "0.1.0"
description = "A PaginatedHasMany field for starlette-admin: paginates a has-many relation's list/detail rendering instead of loading the full collection."
requires-python = ">=3.11"
dependencies = [
    "starlette-admin",
    "sqlalchemy>=2.0",
    "sqlakeyset>=2.0",
    "anyio",
]

[tool.setuptools]
packages = ["starlette_admin_paginated_relations"]

[tool.setuptools.package-data]
starlette_admin_paginated_relations = [
    "templates/**/*.html",
    "static/**/*.js",
    "static/**/*.css",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
